apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: h5
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: ghcr.io/kayttaja/sovellus:latest
        ports: [{containerPort: 8080}]
        env:
        - name: DB_HOST
          value: mysql.h5.svc.cluster.local
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          valueFrom: {configMapKeyRef: {name: db-config, key: MYSQL_DATABASE}}
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: db-secret, key: MYSQL_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: MYSQL_PASSWORD}}
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: h5
spec:
  type: NodePort
  selector: {app: web}
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
